<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3F51B5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تطبيق بشار المحاسبي</title>
<style>
:root{--p:#3F51B5;--g:#2e7d32;--r:#c62828;--bg:#fafafa;--line:#e0e0e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;color:#212121}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:#fff;position:relative}
header{background:var(--p);color:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;min-height:56px;padding-top:env(safe-area-inset-top)}
header h1{font-size:18px;margin:0;flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
header input{flex:1;background:transparent;border:0;border-bottom:1px solid #fff8;color:#fff;font-size:16px;padding:8px 4px;outline:none}
header input::placeholder{color:#fffa}
.ib{background:none;border:0;color:inherit;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.ib:active{background:#fff3}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
.chip{border:1px solid var(--p);color:var(--p);background:#fff;border-radius:18px;padding:6px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--p);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:#f0f0f5}
.row .plus{font-size:30px;color:var(--p);width:44px;text-align:center;line-height:1;border:0;background:none;cursor:pointer}
.callbtn{font-size:19px;width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:50%;background:#f4f6ff;text-align:center;line-height:36px;cursor:pointer;padding:0}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:17px}
.row .sub{font-size:12px;color:#757575;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;font-size:16px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}
footer.bar{background:var(--p);color:#fff;display:flex;justify-content:space-around;padding:14px 8px;font-weight:700;font-size:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.fab{position:absolute;left:16px;bottom:78px;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;border:0;font-size:30px;box-shadow:0 3px 8px #0006;cursor:pointer}
.empty{text-align:center;color:#757575;padding:60px 20px;line-height:1.8}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:13px;color:#555;display:block;margin-bottom:4px}
.form input,.form select{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff;font-family:inherit}
.btns{display:flex;gap:12px}
.btns button{flex:1;padding:14px;font-size:17px;border:0;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}
.b-up{background:var(--g)}.b-dn{background:var(--r)}
.photo{max-width:100%;max-height:200px;border-radius:8px;display:block}
.small{font-size:12px;color:#777}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex}
.drawer{background:#fff;width:80%;max-width:320px;height:100%;overflow-y:auto;padding-top:env(safe-area-inset-top)}
.drawer .it{padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line);cursor:pointer}
.drawer .it:active{background:#eee}
.sheet-ov{align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.sheet .it{padding:16px 20px;font-size:17px;cursor:pointer}
.sheet .it:active{background:#eee}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:40;max-width:90%}
.t-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.t-row .ar{font-size:26px;width:30px;text-align:center}
.t-row .main{flex:1;min-width:0}
.t-row .amt2{font-weight:700;font-size:16px}
.t-row .meta{font-size:12px;color:#757575;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-row .run{font-size:13px;color:#555;min-width:64px;text-align:left}
.scrollx{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{position:sticky;top:0;background:#eef0fb;color:#333;font-weight:700;padding:10px 8px;text-align:right;cursor:pointer;white-space:nowrap;border-bottom:2px solid var(--p);user-select:none}
.rtable th.num,.rtable td.num{text-align:left}
.rtable th .arw{font-size:10px;opacity:.65;margin-left:3px}
.rtable td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtable tr:nth-child(even) td{background:#fafbff}
.rtable tr:active td{background:#eef0fb}
.rtable td.name{white-space:normal;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.badge.g{background:#e6f4ea;color:var(--g)}
.badge.r{background:#fdeaea;color:var(--r)}
.badge.n{background:#eee;color:#666}
.rcard{margin:12px;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--p),#5c6bc0);color:#fff;box-shadow:0 2px 8px #3f51b540}
.rcard .lbl{font-size:12px;opacity:.85}
.rcard .val{font-size:24px;font-weight:800;margin-top:2px}
mark{background:#fdeaea;color:var(--r);padding:0 1px;border-radius:2px}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;inset:0;background:#fff;color:#161616;font-family:Arial,"Noto Naskh Arabic",sans-serif;direction:rtl;padding:0}
  @page{margin:14mm 12mm}
}
.phead{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:3px solid #3F51B5;padding-bottom:12px;margin-bottom:18px}
.phead .logo{font-size:23px;font-weight:800;color:#3F51B5}
.phead .logo span{display:block;font-size:11px;font-weight:400;color:#777;margin-top:2px}
.phead .meta{font-size:11px;color:#666;text-align:left;line-height:1.7}
.ptitle{font-size:19px;font-weight:800;margin:0 0 4px}
.psub{font-size:12px;color:#666;margin-bottom:14px}
.pstats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.pstat{flex:1;min-width:130px;border:1px solid #ddd;border-radius:10px;padding:12px 14px;background:#f6f7fc}
.pstat .l{font-size:10.5px;color:#666}
.pstat .v{font-size:17px;font-weight:800;margin-top:3px;color:#222}
.ptable{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:12px}
.ptable th{background:#3F51B5;color:#fff;padding:8px 9px;text-align:right;font-weight:700}
.ptable th.num,.ptable td.num{text-align:left}
.ptable td{padding:7px 9px;border-bottom:1px solid #e6e6ee}
.ptable tr:nth-child(even) td{background:#f7f8fc}
.ptable tfoot td{font-weight:800;border-top:2px solid #3F51B5;background:#eef0fb;padding:9px}
.psection{margin-bottom:28px;page-break-inside:avoid}
.psection .stitle{font-size:14.5px;font-weight:800;color:#3F51B5;margin-bottom:8px;border-right:4px solid #3F51B5;padding-right:8px}
.pfoot{margin-top:26px;font-size:10px;color:#999;text-align:center;border-top:1px solid #eee;padding-top:10px}
.pup{color:#2e7d32}.pdn{color:#c62828}
.lk-dots{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.lk-dot{width:14px;height:14px;border-radius:50%;background:#ddd;border:1px solid #ccc}
.lk-dot.on{background:var(--p);border-color:var(--p)}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:260px;margin:0 auto}
.lk-key{background:#f0f1f7;color:#222;border:1px solid #ddd;border-radius:50%;aspect-ratio:1;font-size:22px;cursor:pointer}
.lk-key:active{background:#e0e2ee}
#lock-screen{position:fixed;inset:0;background:var(--p);color:#fff;z-index:100;display:flex;align-items:center;justify-content:center}
#lock-screen .lk-wrap{width:100%;max-width:340px;padding:24px;text-align:center}
#lock-screen .lk-logo{font-size:26px;font-weight:800;margin-bottom:6px}
#lock-screen .lk-sub{font-size:14px;opacity:.9;margin-bottom:18px;min-height:20px}
#lock-screen .lk-err{color:#ffcdd2;font-weight:700}
#lock-screen .lk-dot{background:#ffffff40;border-color:#fff8}
#lock-screen .lk-dot.on{background:#fff;border-color:#fff}
#lock-screen .lk-key{background:#ffffff22;color:#fff;border-color:#ffffff33}
#lock-screen .lk-key:active{background:#ffffff44}
#lock-screen .lk-bio{margin-top:22px;background:none;border:1px solid #fff8;color:#fff;border-radius:20px;padding:10px 20px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ أدوات ============ */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('en-US', {maximumFractionDigits: 2}).format(n);
const fdate = iso => { const [y, m, d] = String(iso).split('-'); return `${d}-${m}-${y}`; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const toEn = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.').replace(/[,،\s]/g, '');
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ============ قاعدة البيانات المحلية (IndexedDB) ============ */
let db;
const STORES = ['currencies', 'accounts', 'categories', 'transactions'];
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('daftari', 1);
    r.onupgradeneeded = () => { STORES.forEach(n => r.result.createObjectStore(n, {keyPath: 'id', autoIncrement: true})); };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const st = (s, mode) => db.transaction(s, mode).objectStore(s);
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = s => rq(st(s, 'readonly').getAll());
const dbPut = (s, o) => rq(st(s, 'readwrite').put(o));
const dbDel = (s, id) => rq(st(s, 'readwrite').delete(id));
const dbClear = s => rq(st(s, 'readwrite').clear());

const S = {currencies: [], accounts: [], categories: [], txs: []};
async function load() {
  S.currencies = (await dbAll('currencies')).sort((a, b) => a.sort - b.sort || a.id - b.id);
  S.accounts = await dbAll('accounts');
  S.categories = (await dbAll('categories')).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  S.txs = await dbAll('transactions');
}
async function seed() {
  if ((await dbAll('currencies')).length) return;
  const now = new Date().toISOString();
  const seeds = [['محلي', 'ر.ي', 1], ['دولار', '$', 0], ['سعودي', 'ر.س', 0]];
  for (let i = 0; i < seeds.length; i++) {
    await dbPut('currencies', {name: seeds[i][0], symbol: seeds[i][1], is_default: seeds[i][2], sort: i, created_at: now});
  }
}
const cur = id => S.currencies.find(c => c.id == id);
const acc = id => S.accounts.find(a => a.id == id);
const defaultCur = () => (S.currencies.find(c => c.is_default) || S.currencies[0] || {}).id;

function sums(curId) {
  const m = new Map();
  for (const t of S.txs) {
    if (t.currency_id != curId) continue;
    const o = m.get(t.account_id) || {bal: 0, cnt: 0, last: ''};
    o.bal += t.amount * t.type; o.cnt++; if (t.date > o.last) o.last = t.date;
    m.set(t.account_id, o);
  }
  return m;
}

/* ============ التنقل ============ */
const UI = {view: 'home', curId: null, q: '', search: false, accId: null, accCur: null, aq: '', asearch: false, edit: null, addName: '', addCur: null,
  reportType: 'totals', reportCur: null, rq: '',
  odCur: null, odDays: null,
  reportSort: {totals: {key: 'bal', dir: 'desc'}, monthly: {key: 'month', dir: 'desc'}, details: {key: 'date', dir: 'desc'}, categories: {key: 'net', dir: 'desc'}}};
function go(view, patch = {}) {
  Object.assign(UI, patch, {view});
  history.pushState({snap: {...UI}}, '');
  render();
}
window.addEventListener('popstate', e => {
  if (e.state && e.state.snap) Object.assign(UI, e.state.snap); else UI.view = 'home';
  render();
});
async function back() { history.back(); }

function sheet(items) {
  const ov = document.createElement('div'); ov.className = 'ov sheet-ov';
  const sh = document.createElement('div'); sh.className = 'sheet';
  items.forEach(([label, fn]) => {
    const b = document.createElement('div'); b.className = 'it'; b.textContent = label;
    b.onclick = () => { ov.remove(); fn(); };
    sh.appendChild(b);
  });
  ov.appendChild(sh); ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

function drawer() {
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('div'); d.className = 'drawer';
  const items = [
    ['➕  إضافة مبلغ', () => go('add', {edit: null, addName: '', addCur: UI.curId})],
    ['💱  العملات', () => go('currencies')],
    ['🏷️  التصنيفات', () => go('categories')],
    ['📊  تقرير: إجمالي المبالغ', () => go('reports', {reportType: 'totals', reportCur: UI.curId})],
    ['📊  تقرير: تفاصيل كل المبالغ', () => go('reports', {reportType: 'details', reportCur: UI.curId})],
    ['📊  تقرير: إجمالي شهرياً', () => go('reports', {reportType: 'monthly', reportCur: UI.curId})],
    ['📊  تقرير: إجمالي التصنيفات', () => go('reports', {reportType: 'categories', reportCur: UI.curId})],
    ['⏰  الديون المتأخرة', () => go('overdue', {odCur: UI.curId, odDays: getOdDays()})],
    ['🔒  قفل التطبيق', () => go('lock')],
    ['⬆️  حفظ نسخة احتياطية', backup],
    ['⬇️  استرجاع قاعدة البيانات', restore],
    ['ℹ️  حول البرنامج', () => alert('تطبيق بشار المحاسبي\nدفتر ديون محلي: بياناتك محفوظة في هذا الجوال فقط، ولا تُرسل إلى أي مكان.\nاحرص على حفظ نسخة احتياطية من وقت لآخر.')]
  ];
  items.forEach(([l, fn]) => { const i = document.createElement('div'); i.className = 'it'; i.textContent = l; i.onclick = () => { ov.remove(); fn(); }; d.appendChild(i); });
  ov.appendChild(d); ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

/* ============ الشاشة الرئيسية ============ */
function chipsHtml(selected, fnName) {
  if (S.currencies.length < 2) return '';
  return '<div class="chips">' + S.currencies.map(c => `<div class="chip ${c.id == selected ? 'on' : ''}" onclick="${fnName}(${c.id})">${esc(c.name)}</div>`).join('') + '</div>';
}
function setHomeCur(id) { UI.curId = id; render(); }

function renderHome() {
  if (UI.curId == null || !cur(UI.curId)) UI.curId = defaultCur();
  const m = sums(UI.curId);
  let forMe = 0, onMe = 0;
  for (const o of m.values()) { if (o.bal > 0) forMe += o.bal; else onMe -= o.bal; }
  const q = UI.q.trim();
  const od = getOdDays();
  const rows = [...m.entries()].map(([id, o]) => ({a: acc(id), ...o, days: daysSince(o.last)}))
    .filter(r => r.a && (!q || r.a.name.includes(q)))
    .sort((x, y) => x.a.name.localeCompare(y.a.name, 'ar'));
  app.innerHTML = `
  <header>
    <button class="ib" onclick="drawer()">☰</button>
    ${UI.search ? `<input id="q" placeholder="بحث بالاسم" value="${esc(UI.q)}" oninput="UI.q=this.value;render(true)">` : '<h1>تطبيق بشار المحاسبي</h1>'}
    <button class="ib" onclick="toggleSearch()">${UI.search ? '✕' : '🔍'}</button>
  </header>
  <main>
    ${chipsHtml(UI.curId, 'setHomeCur')}
    ${rows.length ? rows.map(r => `
      <div class="row" onclick="openAccount(${r.a.id})">
        <button class="plus" onclick="event.stopPropagation();addFor(${r.a.id})">+</button>
        <div class="mid"><div class="nm">${esc(r.a.name)}</div><div class="sub">${r.cnt} عملية${r.bal !== 0 && r.days >= od ? ` · <b style="color:var(--r)">متأخر ${r.days} يوم</b>` : ''}</div></div>
        ${r.a.phone ? `<button class="callbtn" title="اتصال بـ ${esc(r.a.phone)}" onclick="event.stopPropagation();callAcc(${r.a.id})">📞</button>` : ''}
        <div class="amt ${r.bal >= 0 ? 'up' : 'dn'}">${fmt(Math.abs(r.bal))} ${r.bal >= 0 ? '▲' : '▼'}</div>
      </div>`).join('') : `<div class="empty">لا توجد حسابات بهذه العملة.<br>اضغط (+) لإضافة مبلغ.</div>`}
  </main>
  <button class="fab" onclick="go('add',{edit:null,addName:'',addCur:UI.curId})">+</button>
  <footer class="bar"><span>لك: ${fmt(forMe)}</span><span>عليك: ${fmt(onMe)}</span></footer>`;
  if (UI.search) { const i = document.getElementById('q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
function toggleSearch() { UI.search = !UI.search; if (!UI.search) UI.q = ''; render(); }
function addFor(id) { go('add', {edit: null, addName: acc(id).name, addCur: UI.curId}); }
function callAcc(id) { const p = (acc(id) || {}).phone; if (p) location.href = 'tel:' + p; }
function openAccount(id) { go('account', {accId: id, accCur: UI.curId, aq: '', asearch: false}); }

/* ============ كشف الحساب ============ */
function accTxs(accId, curId) {
  return S.txs.filter(t => t.account_id == accId && t.currency_id == curId)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
}
function setAccCur(id) { UI.accCur = id; render(); }
function renderAccount() {
  const a = acc(UI.accId);
  if (!a) { UI.view = 'home'; return renderHome(); }
  const curs = S.currencies.filter(c => S.txs.some(t => t.account_id == a.id && t.currency_id == c.id));
  if (!curs.length) { back(); return; }
  if (!curs.some(c => c.id == UI.accCur)) UI.accCur = curs[0].id;
  let run = 0;
  const all = accTxs(a.id, UI.accCur).map(t => { run += t.amount * t.type; return {...t, run}; });
  const balance = run, q = UI.aq.trim();
  const shown = (q ? all.filter(t => (t.details || '').includes(q) || t.date.includes(q) || fmt(t.amount).includes(q) || String(t.amount).includes(q) || (catName(t.category_id) || '').includes(q)) : all).reverse();
  const cname = cur(UI.accCur).name;
  const chips = curs.length > 1 ? '<div class="chips">' + curs.map(c => `<div class="chip ${c.id == UI.accCur ? 'on' : ''}" onclick="setAccCur(${c.id})">${esc(c.name)}</div>`).join('') + '</div>' : '';
  app.innerHTML = `
  <header>
    <button class="ib" onclick="back()">→</button>
    ${UI.asearch ? `<input id="aq" placeholder="كلمة، تاريخ، مبلغ" value="${esc(UI.aq)}" oninput="UI.aq=this.value;render(true)">` : `<h1>كشف حساب # ${esc(a.name)}</h1>`}
    <button class="ib" onclick="UI.asearch=!UI.asearch;if(!UI.asearch)UI.aq='';render()">${UI.asearch ? '✕' : '🔍'}</button>
    <button class="ib" onclick="accMenu()">⋮</button>
  </header>
  <main>
    ${chips}
    ${shown.length ? shown.map(t => `
      <div class="t-row" onclick="txMenu(${t.id})">
        <div class="ar ${t.type == 1 ? 'up' : 'dn'}">${t.type == 1 ? '▲' : '▼'}</div>
        <div class="main">
          <div class="amt2">${fmt(t.amount)} <span class="small">${fdate(t.date)}${t.photo ? ' 📷' : ''}</span></div>
          <div class="meta">${esc([t.details, t.category_id ? '#' + catName(t.category_id) : ''].filter(Boolean).join('  '))}</div>
        </div>
        <div class="run">${fmt(t.run)}</div>
      </div>`).join('') : '<div class="empty">لا توجد عمليات.</div>'}
  </main>

function readPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ============ التقارير ============ */
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function monthLabel(key) { const [y, m] = key.split('-'); return `${AR_MONTHS[+m - 1]} ${y}`; }
function daysSince(dateStr) {
  if (!dateStr) return 0;
  const a = new Date(dateStr + 'T00:00:00'), b = new Date(today() + 'T00:00:00');
  return Math.max(0, Math.round((b - a) / 86400000));
}
function currencyNetBalance(curId) {
  let s = 0; for (const o of sums(curId).values()) s += o.bal; return s;
}
function hl(text, q) {
  text = String(text ?? '');
  if (!q) return esc(text);
  const i = text.indexOf(q);
  if (i === -1) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function sortRows(rows, key, dir, type) {
  return [...rows].sort((a, b) => {
    if (type === 'text') { const c = String(a[key] || '').localeCompare(String(b[key] || ''), 'ar'); return dir === 'asc' ? c : -c; }
    const x = Number(a[key]) || 0, y = Number(b[key]) || 0;
    return dir === 'asc' ? x - y : y - x;
  });
}
function setReportType(t) { UI.reportType = t; render(); }
function setReportCur(id) { UI.reportCur = id; render(); }
function sortReport(key) {
  const s = UI.reportSort[UI.reportType];
  if (s.key === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc'; else { s.key = key; s.dir = 'desc'; }
  render();
}
function computeTotals(curId) {
  const m = sums(curId), rows = [];
  for (const [id, o] of m.entries()) { const a = acc(id); if (a) rows.push({id, name: a.name, cnt: o.cnt, last: o.last, days: daysSince(o.last), bal: o.bal}); }
  return rows;
}
function computeMonthly(curId) {
  const list = S.txs.filter(t => t.currency_id == curId).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const map = new Map();
  for (const t of list) {
    const k = t.date.slice(0, 7);
    const o = map.get(k) || {month: k, cnt: 0, net: 0};
    o.cnt++; o.net += t.amount * t.type;
    map.set(k, o);
  }
  let run = 0;
  return [...map.keys()].sort().map(k => { const o = map.get(k); run += o.net; return {month: k, label: monthLabel(k), cnt: o.cnt, net: o.net, balance: run}; });
}
function computeDetails(curId, q) {
  let rows = S.txs.filter(t => t.currency_id == curId).map(t => ({
    id: t.id, date: t.date, name: (acc(t.account_id) || {}).name || '', details: t.details || '',
    cat: t.category_id ? (catName(t.category_id) || '') : '', amount: t.amount, type: t.type
  }));
  const q2 = (q || '').trim();
  if (q2) rows = rows.filter(r => r.name.includes(q2) || r.details.includes(q2) || r.date.includes(q2) || r.cat.includes(q2) || fmt(r.amount).includes(q2) || String(r.amount).includes(q2));
  return rows;
}
function computeCategories(curId) {
  const map = new Map();
  const ensure = key => { if (!map.has(key)) map.set(key, {id: key, name: key === '_none' ? 'بدون تصنيف' : (catName(key) || 'بدون تصنيف'), cnt: 0, forMe: 0, onMe: 0}); return map.get(key); };
  for (const t of S.txs) {
    if (t.currency_id != curId) continue;
    const o = ensure(t.category_id || '_none');
    o.cnt++; if (t.type == 1) o.forMe += t.amount; else o.onMe += t.amount;
  }
  return [...map.values()].map(o => ({...o, net: o.forMe - o.onMe}));
}
function reportCurChips(selected) {
  if (S.currencies.length < 2) return '';
  return '<div class="chips">' + S.currencies.map(c => `<div class="chip ${c.id == selected ? 'on' : ''}" onclick="setReportCur(${c.id})">${esc(c.name)}</div>`).join('') + '</div>';
}

  const empty = '<div class="empty">لا توجد بيانات لهذا التقرير بهذه العملة.</div>';
  const rcard = (lbl, val, sub) => `<div class="rcard"><div class="lbl">${esc(lbl)}</div><div class="val">${esc(val)}</div><div class="lbl" style="margin-top:4px">${esc(sub)}</div></div>`;
  const types = [['totals', 'إجمالي المبالغ'], ['details', 'تفاصيل كل المبالغ'], ['monthly', 'إجمالي شهرياً'], ['categories', 'إجمالي التصنيفات']];
  const cname = cur(curId).name;
  let bodyHtml = '', cardHtml = '';

  if (type === 'totals') {
    let rows = sortRows(computeTotals(curId), sort.key, sort.dir, sort.key === 'name' ? 'text' : 'num');
    cardHtml = rcard('إجمالي الأرصدة', fmt(currencyNetBalance(curId)) + ' ' + cname, rows.length + ' حساب');

        <td class="num ${r.bal >= 0 ? 'up' : 'dn'}">${fmt(Math.abs(r.bal))} ${r.bal >= 0 ? '▲' : '▼'}</td>
      </tr>`).join('')}</tbody></table></div>` : empty;
  } else if (type === 'monthly') {
    let rows = sortRows(computeMonthly(curId), sort.key, sort.dir, sort.key === 'month' ? 'text' : 'num');
    cardHtml = rcard('الرصيد الحالي', fmt(currencyNetBalance(curId)) + ' ' + cname, rows.length + ' شهر مسجّل');
    bodyHtml = rows.length ? `<div class="scrollx"><table class="rtable"><thead><tr>
        <th onclick="sortReport('month')">الشهر ${arrow('month')}</th>
        <th class="num" onclick="sortReport('cnt')">العمليات ${arrow('cnt')}</th>

      </tr></thead><tbody>${rows.map(r => `<tr>
        <td class="name">${esc(r.label)}</td>
        <td class="num">${r.cnt}</td>
        <td class="num ${r.net >= 0 ? 'up' : 'dn'}">${r.net >= 0 ? '+' : '−'}${fmt(Math.abs(r.net))}</td>

      </tr>`).join('')}</tbody></table></div>` : empty;
  } else if (type === 'details') {
    let rows = sortRows(computeDetails(curId, UI.rq), sort.key, sort.dir, ['date', 'name', 'details', 'cat'].includes(sort.key) ? 'text' : 'num');

const OD_KEY = 'daftari_od_days';
function getOdDays() { const d = parseInt(localStorage.getItem(OD_KEY), 10); return d > 0 ? d : 30; }
function setOdDays(d) { try { localStorage.setItem(OD_KEY, String(d)); } catch {} }
function overdueRows(curId, days) {
  const rows = [];
  for (const [id, o] of sums(curId).entries()) {
    const a = acc(id);
    if (!a || o.bal === 0) continue;
    const d = daysSince(o.last);
    if (d >= days) rows.push({a, bal: o.bal, cnt: o.cnt, days: d, last: o.last});
  }
  return rows.sort((x, y) => y.days - x.days);
}
function setOdCur(id) { UI.odCur = id; render(); }
function setOdDaysUI(d) { UI.odDays = d; setOdDays(d); render(); }
function renderOverdue() {

/* ============ قفل التطبيق (PIN / بصمة) ============ */
const LOCK_KEY = 'daftari_lock_v1';
function getLockCfg() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null') || {}; } catch { return {}; } }
function saveLockCfg(cfg) { try { localStorage.setItem(LOCK_KEY, JSON.stringify(cfg)); } catch {} }
function isLockEnabled() { const c = getLockCfg(); return !!(c && c.enabled && c.pinHash); }
function b64u(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64uToBuf(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return buf.buffer; }
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  return b64u(await crypto.subtle.digest('SHA-256', data));
}
async function webauthnAvailable() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch { return false; }
}
function pinPad(onPress) {
  return `<div class="lk-pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k === '' ? '<div></div>' : `<button type="button" class="lk-key" data-k="${k}">${k}</button>`).join('')}</div>`;
}
function wirePad(onPress) { document.querySelectorAll('.lk-key').forEach(b => b.onclick = () => onPress(b.dataset.k)); }

let lockEl = null;
function showLockScreen(onUnlock) {
  if (!lockEl) { lockEl = document.createElement('div'); lockEl.id = 'lock-screen'; document.body.appendChild(lockEl); }
  const cfg = getLockCfg();
  const hasBio = !!cfg.webauthnId;
  let pin = '';
  function draw(msg) {
    lockEl.innerHTML = `<div class="lk-wrap">
      <div class="lk-logo">📒 تطبيق بشار المحاسبي</div>
      <div class="lk-sub">${msg ? `<span class="lk-err">${esc(msg)}</span>` : 'أدخل رمز القفل'}</div>
      <div class="lk-dots">${[0, 1, 2, 3].map(i => `<span class="lk-dot ${i < pin.length ? 'on' : ''}"></span>`).join('')}</div>
      ${pinPad()}
      ${hasBio ? '<button type="button" class="lk-bio" id="lk-bio">👆 فتح بالبصمة</button>' : ''}
    </div>`;
    wirePad(press);
    if (hasBio) document.getElementById('lk-bio').onclick = tryBio;
  }
  async function press(k) {
    if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    if (pin.length === 4) {
      const h = await hashPin(pin, cfg.salt);
      if (h === cfg.pinHash) { lockEl.remove(); lockEl = null; onUnlock(); return; }
      pin = ''; draw('رمز خاطئ، حاول مجدداً'); return;
    }
    draw();
  }
  async function tryBio() {
    try {
      await navigator.credentials.get({publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{id: b64uToBuf(cfg.webauthnId), type: 'public-key'}],
        userVerification: 'required', timeout: 30000
      }});
      lockEl.remove(); lockEl = null; onUnlock();
    } catch (e) { draw('تعذّر التحقق بالبصمة'); }
  }
  draw();
  if (hasBio) setTimeout(tryBio, 300);
}

function renderLock() {
  const cfg = getLockCfg(), enabled = isLockEnabled();
  app.innerHTML = `
  <header><button class="ib" onclick="back()">→</button><h1>قفل التطبيق</h1></header>
  <main>
    <div class="empty" style="padding:26px 20px 14px">
      <div style="font-size:42px">${enabled ? '🔒' : '🔓'}</div>
      <div style="font-size:16px;margin-top:8px;font-weight:700">${enabled ? 'القفل مفعّل' : 'القفل غير مفعّل'}</div>
      <div class="small" style="margin-top:10px;line-height:1.8">يطلب رمز PIN من 4 أرقام عند فتح التطبيق أو العودة إليه.<br>هذا يمنع فتح التطبيق مباشرة، ولا يُشفّر البيانات المخزّنة في الجهاز.</div>
    </div>
    <div class="form" style="padding-top:0">
      ${!enabled
        ? '<button type="button" class="chip" id="lk-enable" style="padding:14px;font-size:16px">تفعيل القفل بإنشاء رمز PIN</button>'
        : `<button type="button" class="chip" id="lk-change" style="padding:14px;font-size:16px">تغيير رمز PIN</button>
           <button type="button" class="chip" id="lk-disable" style="padding:14px;font-size:16px;border-color:var(--r);color:var(--r)">إلغاء تفعيل القفل</button>
           <div id="lk-bio-row"></div>`}

  if (!enabled) {

async function renderBioRow(cfg) {
  const row = document.getElementById('lk-bio-row'); if (!row) return;
  if (!(await webauthnAvailable())) { row.innerHTML = ''; return; }
  if (cfg.webauthnId) {
    row.innerHTML = '<button type="button" class="chip" id="lk-bio-off" style="padding:14px;font-size:16px">إلغاء فتح البصمة</button>';
    document.getElementById('lk-bio-off').onclick = () => { cfg.webauthnId = null; saveLockCfg(cfg); renderLock(); };
  } else {
    row.innerHTML = '<button type="button" class="chip" id="lk-bio-on" style="padding:14px;font-size:16px">تفعيل فتح البصمة</button>';
    document.getElementById('lk-bio-on').onclick = enrollBio;
  }
}
async function enrollBio() {
  try {
    const cfg = getLockCfg();
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name: 'تطبيق بشار المحاسبي'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'daftari-user', displayName: 'تطبيق بشار المحاسبي'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required'},
      timeout: 30000
    }});
    cfg.webauthnId = b64u(cred.rawId); saveLockCfg(cfg); toast('تم تفعيل فتح البصمة'); renderLock();
  } catch (e) { toast('تعذّر تفعيل البصمة على هذا الجهاز'); }
}
function setupPin(requireOld) {
  const cfg = getLockCfg();
  let step = requireOld ? 'old' : 'new1', oldPin = '', newPin = '', newPin2 = '';
  const titles = {old: 'أدخل الرمز الحالي', new1: 'أدخل رمز PIN جديد (4 أرقام)', new2: 'أعد إدخال الرمز للتأكيد'};
  function draw(msg) {
    const cur = step === 'old' ? oldPin : (step === 'new1' ? newPin : newPin2);
    app.innerHTML = `
    <header><button class="ib" onclick="go('lock')">→</button><h1>${requireOld ? 'تغيير رمز PIN' : 'إنشاء رمز PIN'}</h1></header>
    <main>
      <div class="empty" style="padding:30px 20px 6px">
        <div style="font-weight:700">${titles[step]}</div>
        ${msg ? `<div class="small" style="color:var(--r);margin-top:8px">${esc(msg)}</div>` : ''}
        <div class="lk-dots" style="margin-top:22px">${[0, 1, 2, 3].map(i => `<span class="lk-dot ${i < cur.length ? 'on' : ''}"></span>`).join('')}</div>
      </div>
      ${pinPad()}
    </main>`;
    wirePad(press);
  }
  async function press(k) {
    let cur = step === 'old' ? oldPin : (step === 'new1' ? newPin : newPin2);
    if (k === '⌫') cur = cur.slice(0, -1); else if (cur.length < 4) cur += k;
    if (step === 'old') oldPin = cur; else if (step === 'new1') newPin = cur; else newPin2 = cur;
    if (cur.length === 4) {
      if (step === 'old') {
        const h = await hashPin(oldPin, cfg.salt);
        if (h !== cfg.pinHash) { oldPin = ''; draw('رمز خاطئ'); return; }
        step = 'new1'; draw(); return;
      }
      if (step === 'new1') { step = 'new2'; draw(); return; }
      const h1 = newPin, h2 = newPin2;
      if (h1 !== h2) { newPin = ''; newPin2 = ''; step = 'new1'; draw('الرمزان غير متطابقين، حاول مجدداً'); return; }
      const salt = b64u(crypto.getRandomValues(new Uint8Array(16)).buffer);
      const pinHash = await hashPin(newPin, salt);
      saveLockCfg({...cfg, enabled: 1, salt, pinHash});
      toast('تم حفظ رمز القفل'); go('lock'); return;
    }
    draw();
  }
  draw();
}
function confirmThenDisable() {
  const cfg = getLockCfg();
  let pin = '';
  function draw(msg) {
    app.innerHTML = `
    <header><button class="ib" onclick="go('lock')">→</button><h1>إلغاء تفعيل القفل</h1></header>
    <main>
      <div class="empty" style="padding:30px 20px 6px">
        <div style="font-weight:700">أدخل الرمز الحالي للتأكيد</div>
        ${msg ? `<div class="small" style="color:var(--r);margin-top:8px">${esc(msg)}</div>` : ''}
        <div class="lk-dots" style="margin-top:22px">${[0, 1, 2, 3].map(i => `<span class="lk-dot ${i < pin.length ? 'on' : ''}"></span>`).join('')}</div>
      </div>
      ${pinPad()}
    </main>`;
    wirePad(press);
  }
  async function press(k) {
    if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    if (pin.length === 4) {
      const h = await hashPin(pin, cfg.salt);
      if (h === cfg.pinHash) { saveLockCfg({enabled: 0}); toast('تم إلغاء القفل'); go('lock'); return; }
      pin = ''; draw('رمز خاطئ'); return;
    }
    draw();
  }
  draw();
}

/* ============ تذكير النسخ الاحتياطي ============ */
const BK_KEY = 'daftari_last_backup';
function lastBackupDate() { try { return localStorage.getItem(BK_KEY); } catch { return null; } }
function markBackedUp() { try { localStorage.setItem(BK_KEY, today()); } catch {} }
let reminderShown = false;
function maybeShowBackupReminder() {
  if (reminderShown || !S.txs.length) return;
  const last = lastBackupDate();
  const days = last ? daysSince(last) : 999;
  if (days < 14) return;
  reminderShown = true;
  setTimeout(() => {
    const msg = last
      ? `مضى ${days} يوماً منذ آخر نسخة احتياطية (${fdate(last)}).\nهل تريد حفظ نسخة الآن؟`
      : 'لم تقم بعمل نسخة احتياطية من قبل.\nفقدان الجوال أو مسح بياناته يعني فقدان كل الحسابات.\nهل تريد حفظ نسخة الآن؟';
    if (confirm(msg)) backup();
  }, 500);
}

/* ============ النسخ الاحتياطي والاسترجاع ============ */
async function backup() {
  const data = {app: 'daftari', version: 1, exported_at: new Date().toISOString(),
    currencies: S.currencies, accounts: S.accounts, categories: S.categories, transactions: S.txs};
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const name = `daftari_${today()}.json`;
  const file = new File([blob], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'نسخة احتياطية - تطبيق بشار المحاسبي'}); markBackedUp(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); markBackedUp(); toast('تم حفظ النسخة الاحتياطية');
}
function restore() {
  if (!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. يُفضّل حفظ نسخة احتياطية أولاً. متابعة؟')) return;
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'daftari' || !Array.isArray(d.transactions)) throw new Error('bad');
      const safety = {currencies: S.currencies, accounts: S.accounts, categories: S.categories, transactions: S.txs};
      try { localStorage.setItem('daftari_before_restore', JSON.stringify(safety)); } catch (e) { /* قد تكون الصور كبيرة */ }
      for (const s of STORES) await dbClear(s);
      for (const s of STORES) for (const o of (d[s] || [])) await dbPut(s, o);
      await seed(); await load(); UI.curId = null; go('home'); toast('تم استرجاع البيانات');
    } catch (e) { toast('ملف غير صالح'); }
  };
  i.click();
}

/* ============ التشغيل ============ */
function render(keepFocus) {
  switch (UI.view) {
    case 'account': return renderAccount();
    case 'add': return renderAdd();
    case 'currencies': return renderCurrencies();
    case 'categories': return renderCategories();
    case 'reports': return renderReports();
    case 'overdue': return renderOverdue();
    case 'lock': return renderLock();
    default: return renderHome();
  }
}
let appHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (isLockEnabled()) appHidden = true; }
  else if (appHidden && isLockEnabled()) { appHidden = false; showLockScreen(() => {}); }
});
(async function init() {
  try {
    await openDB(); await seed(); await load();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    history.replaceState({snap: {...UI}}, '');
    const start = () => { render(); maybeShowBackupReminder(); };
    if (isLockEnabled()) showLockScreen(start); else start();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) {
    app.innerHTML = '<div class="empty">تعذّر فتح التخزين المحلي في هذا المتصفح.<br>لا تستخدم وضع التصفح الخفي.</div>';
  }
})();
</script>
