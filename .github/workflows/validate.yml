name: Validate Daftari

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline application JavaScript
        run: node scripts/check-inline-script.mjs
      - name: Check service worker JavaScript
        run: node --check sw.js
      - name: Run backup validation tests
        run: node --test tests/*.test.mjs
